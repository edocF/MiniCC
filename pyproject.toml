[project]
name = "MiniCC"
version = "0.1.0"
description = "一个测试单agent智能体工具"
authors = [
    {name = "CoderF",email = "3247206237@qq.com"}
]
requires-python = ">=3.10"
dependencies = [
    "openai (>=2.32.0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic (>=2.4.0,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "MiniCC", from = "src" }]
